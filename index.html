<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="DVE_L8_SoloSculpt.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.png" shadow-intensity="1" camera-orbit="53.71deg 74.62deg 0.3458m" field-of-view="30deg" auto-rotate id="gear">


      <button class="Hotspot" slot="hotspot-1" data-position="0.01244788052477685m 0.09231871047874983m 0.05531058271554486m" data-normal="0.8238242310120384m 0.5255484679075654m 0.2123969027020749m" data-visibility-attribute="visible" onMouseOver="addhotspot1()" onMouseOut="removehotspot1()">
          <div class="HotspotAnnotation" id="hotspot1" style="visibility:hidden">Body</div>
      </button>

<button class="Hotspot" slot="hotspot-2" data-position="0.019718949753576142m 0.05705572090261815m -0.050031307811940116m" data-normal="0.2018014709655485m 0.29385584351212596m 0.9343045057955774m" data-visibility-attribute="visible" onMouseOver="addhotspot2()" onMouseOut="removehotspot2()">
          <div class="HotspotAnnotation" id="hotspot2" style="visibility:hidden">Grip</div>
      </button>

<button class="Hotspot" slot="hotspot-3" data-position="0.05282780813785462m 0.0011985126764340124m -0.024332690217815235m" data-normal="0.9076713330933828m -0.00021355813158403046m -0.41968167159575376m" data-visibility-attribute="visible" onMouseOver="addhotspot3()" onMouseOut="removehotspot3()">
          <div class="HotspotAnnotation" id="hotspot3" style="visibility:hidden">Pins</div>
      </button>

<button class="Hotspot" slot="hotspot-4" data-position="0.03938963471108829m 0.04752544975280761m -0.020810631035637725m" data-normal="0m 1m 2.220446049250313e-16m" data-visibility-attribute="visible" onMouseOver="addhotspot4()" onMouseOut="removehotspot4()">
          <div class="HotspotAnnotation" id="hotspot4" style="visibility:hidden">Screen</div>
      </button>


      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>


<div style="position:absolute; bottom:0px; right:0px">
    <button onClick="setOrbit('312.7deg 90.44deg 0.3458m')">Front</button>
    <button onClick="setOrbit('311.2deg 0.0000573deg 0.3458m')">Top</button>
    <button onClick="setOrbit('310.9deg 180deg 0.3458m')">Bottom</button>
</div>


    </model-viewer>  


<script>

function addhotspot1(){
document.getElementById("hotspot1").style.visibility="visible"
}
function removehotspot1(){
document.getElementById("hotspot1").style.visibility="hidden";
}

function addhotspot2(){
document.getElementById("hotspot2").style.visibility="visible"
}
function removehotspot2(){
document.getElementById("hotspot2").style.visibility="hidden";
}

function addhotspot3(){
document.getElementById("hotspot3").style.visibility="visible"
}
function removehotspot3(){
document.getElementById("hotspot3").style.visibility="hidden";
}

function addhotspot4(){
document.getElementById("hotspot4").style.visibility="visible"
}
function removehotspot4(){
document.getElementById("hotspot4").style.visibility="hidden";
}


</script>


<script>
    function setOrbit(orbit){
             document.getElementById('gear').cameraOrbit = orbit;
    }
</script>



    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </body>
</html>
